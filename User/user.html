<body>
    <a class="skip-link" href="#visitorContent">Skip to main content</a>

    <div id="visitorApp" class="app-shell visitor-hub-layout">
        <div class="main-col">
            <header class="topbar">
                <div class="visitor-hub-brand">
                    <span id="crestSlotF"></span>
                    <span>UniServe<small>Office of Student Services</small></span>
                </div>
                <div class="topbar-right">
                    <a class="visitor-queue-link" href="../Landing/landing.html?view=queue"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M16 3a4 4 0 0 1 0 8M22 21v-2a4 4 0 0 0-3-3.87M13 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0z"/></svg><span>Live Queue</span></a>
                </div>
            </header>
            <button type="button" class="visitor-accessibility-button" id="a11yBtn" aria-haspopup="dialog" aria-label="Accessibility settings" aria-keyshortcuts="Alt+Shift+A" title="Accessibility settings (Alt+Shift+A)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="4.5" r="1.8"/><path d="M5 8.5l7 1.5 7-1.5M12 10v5M9 21l3-6 3 6"/></svg></button>
            <div class="visitor-section-bar visitor-home-bar"><a class="btn btn-ghost btn-sm system-back-link home-back-arrow" href="../Landing/landing.html" aria-label="Back to home" title="Back to home"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 5-7 7 7 7M5 12h14"/></svg></a></div>
            <section class="visitor-hub" id="visitorHub" aria-labelledby="visitorWelcomeTitle">
                <div class="visitor-welcome">
                    <div class="visitor-welcome-copy">
                    <span class="visitor-welcome-eyebrow">STUDENT &amp; GUEST SERVICES</span>
                    <h1 id="visitorWelcomeTitle">Welcome to <em>UniServe.</em></h1>
                    <p>How can we help you today?</p>
                    <span class="visitor-welcome-prompt">Access OSS services, manage your visit, or get assistance.</span>
                    <div id="visitorHubOfficeNotice" class="visitor-hub-office-notice" role="status" hidden></div>
                    </div>
                </div>
                <nav class="visitor-hub-nav" aria-label="Visitor services">
                    <ul id="visitorNavList"></ul>
                </nav>
                <div class="visitor-hub-reading-tools"></div>
            </section>
            <div class="visitor-section-bar" id="visitorSectionBar" hidden><button type="button" class="home-back-arrow btn btn-ghost btn-sm system-back-link" onclick="visitorSectionBack()" aria-label="Back to services" title="Back to services"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 5-7 7 7 7M5 12h14"/></svg></button></div>
            <div class="sr-only"><h2 id="visitorPageTitle">Start Your Visit</h2><p id="visitorPageSub">Choose a service and how you want to visit.</p></div>
            <main class="content" id="visitorContent" hidden></main>
