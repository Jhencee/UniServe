    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start Your Visit &mdash; UniServe Visitor Services</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="user.css?v=20261124-service-style-cleanup">
    <link rel="stylesheet" href="accessibility.css">

<body>
    <a class="skip-link" href="#visitorContent">Skip to main content</a>

    <div id="visitorApp" class="app-shell visitor-hub-layout">
        <div class="main-col">
            <header class="topbar">
                <div class="visitor-hub-brand">
                    <span id="crestSlotF"></span>
                    <span>UniServe<small>Office of Student Services</small></span>
                </div>
                <div class="topbar-right">
                    <details class="visitor-actions" id="visitorActions">
                    <summary aria-label="More options" title="More options"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></summary>
                    <div class="visitor-actions-panel">
                    <button type="button" class="btn btn-ghost btn-sm a11y-btn" id="a11yBtn" aria-haspopup="dialog" aria-label="Accessibility settings" aria-keyshortcuts="Alt+Shift+A" title="Accessibility settings (Alt+Shift+A)">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="4.5" r="1.8" /><path d="M5 8.5l7 1.5 7-1.5M12 10v5M9 21l3-6 3 6" /></svg>
                        <span>Accessibility</span>
                    </button>
                    <button type="button" id="visitorThemeToggle" role="switch" aria-checked="false" aria-label="Dark mode">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" /></svg>
                        <span>Dark mode</span><span class="visitor-theme-state" aria-hidden="true">Off</span>
                    </button>
                    </div>
                    </details>
                </div>
            </header>
            <div class="visitor-section-bar visitor-home-bar"><a class="btn btn-ghost btn-sm system-back-link home-back-arrow" href="../Landing/landing.html" aria-label="Back to home" title="Back to home"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 5-7 7 7 7M5 12h14"/></svg></a></div>
            <section class="visitor-hub" id="visitorHub" aria-labelledby="visitorWelcomeTitle">
                <div class="visitor-welcome">
                    <div class="visitor-welcome-copy">
                    <span class="visitor-welcome-eyebrow">STUDENT &amp; GUEST SERVICES</span>
                    <h1 id="visitorWelcomeTitle">Welcome to <em>UniServe.</em></h1>
                    <p>How can we help you today?</p>
                    <span class="visitor-welcome-prompt">Access OSS services, manage your visit, or get assistance.</span>
                    <div id="visitorHubOfficeNotice" class="visitor-hub-office-notice" role="status" hidden></div>
                    </div>
                </div>
                <nav class="visitor-hub-nav" aria-label="Visitor services">
                    <ul id="visitorNavList"></ul>
                </nav>
                <div class="visitor-hub-reading-tools"></div>
            </section>
            <div class="visitor-section-bar" id="visitorSectionBar" hidden><button type="button" class="home-back-arrow btn btn-ghost btn-sm system-back-link" onclick="visitorSectionBack()" aria-label="Back to services" title="Back to services"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 5-7 7 7 7M5 12h14"/></svg></button></div>
            <div class="sr-only"><h2 id="visitorPageTitle">Start Your Visit</h2><p id="visitorPageSub">Choose a service and how you want to visit.</p></div>
            <main class="content" id="visitorContent" hidden></main>
        </div>
    </div>

    <div class="toast-wrap" id="toastWrap" aria-live="polite"></div>
    <script src="../shared/office-calendar.js?v=20261125-opening-today"></script>
    <script src="../shared/ui-components.js?v=20261121-modal-back-text"></script>
    <script src="visit-flow.js"></script>
    <script src="../shared/code-cooldown.js"></script>
    <script src="../shared/visitor-turnstile.js"></script>
    <script src="../shared/visit-enhancements.js?v=20261120-student-placeholder"></script>
    <script src="user.js?v=20261124-change-service-weight"></script>
    <script src="chat-identity.js?v=20261124-chat-closed-interface"></script>
    <script src="../shared/appointment-api.js?v=20261109-requirement-readiness"></script>

    <script src="../shared/private-record-cache.js?v=20261120-ticket-refresh-cleanup"></script>
    <script src="accessibility.js"></script>
    <script src="../shared/code-boxes.js?v=20261124-chat-code-boxes"></script>
    <script src="../shared/responsive.js"></script>
    <script src="../shared/portal-api.js?v=20261124-chat-recovery"></script>
    <script src="../shared/realtime-updates.js?v=20261109-consistency-pass"></script>
    <script src="visitor-actions.js?v=20261120-ticket-export-fix"></script>
</body>

</html>
