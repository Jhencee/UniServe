<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start Your Visit &mdash; UniServe Visitor Services</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="user.css">
    <link rel="stylesheet" href="a11y.css">
    <link rel="stylesheet" href="hamburger.css">
</head>

<body>
    <a class="skip-link" href="#visitorContent">Skip to main content</a>

    <div id="visitorApp" class="app-shell">
        <aside class="sidebar" id="visitorSidebar" aria-label="Visitor portal">
            <div class="sidebar-brand">
                <span class="crest" id="crestSlotF"></span>
                <span class="name">UniServe<small>Visitor Portal</small></span>
                <button type="button" class="sb-toggle" id="sbToggle" aria-controls="visitorSidebar" aria-expanded="true" aria-label="Close menu" onclick="toggleSidebarUI()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M4 6h16M4 12h10M4 18h16" /></svg>
                </button>
            </div>
            <nav aria-label="Main" style="flex:1; display:flex; min-height:0;">
                <ul class="nav-list" id="visitorNavList" style="flex:1;"></ul>
            </nav>
            <div class="sidebar-foot">
                <button type="button" class="btn btn-ghost btn-sm btn-block" title="Back to Home" aria-label="Back to Home" onclick="confirmLogout()">&larr; Back to Home</button>
            </div>
        </aside>

        <div class="main-col">
            <header class="topbar">
                <div style="display:flex; align-items:center; gap:12px;">
                    <button type="button" class="menu-btn" aria-label="Open menu" aria-controls="visitorSidebar" aria-expanded="false"
                        onclick="toggleSidebarUI()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M4 6h16M4 12h10M4 18h16" /></svg>
                    </button>
                    <div>
                        <h1 id="visitorPageTitle">Start Your Visit</h1>
                        <div class="sub" id="visitorPageSub">Choose a service and decide whether to walk in or schedule ahead.</div>
                    </div>
                </div>
                <div class="topbar-right">
                    <button type="button" class="btn btn-ghost btn-sm a11y-btn" id="a11yBtn" aria-haspopup="dialog" aria-label="Accessibility settings" aria-keyshortcuts="Alt+Shift+A" title="Accessibility settings (Alt+Shift+A)">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="4.5" r="1.8" /><path d="M5 8.5l7 1.5 7-1.5M12 10v5M9 21l3-6 3 6" /></svg>
                    </button>
                    <div class="theme-toggle" role="group" aria-label="Color theme">
                        <button type="button" class="theme-btn" data-theme-btn="light" onclick="setTheme('light')" aria-label="Switch to light mode" title="Light mode">
                            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" /></svg>
                        </button>
                        <button type="button" class="theme-btn" data-theme-btn="dark" onclick="setTheme('dark')" aria-label="Switch to dark mode" title="Dark mode">
                            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" /></svg>
                        </button>
                    </div>
                </div>
            </header>
            <main class="content" id="visitorContent"></main>
        </div>
    </div>

    <div class="toast-wrap" id="toastWrap" aria-live="polite"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="user.js"></script>
    <script src="a11y.js"></script>
    <script src="hamburger.js"></script>
</body>

</html>
