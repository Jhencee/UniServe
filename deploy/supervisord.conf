[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/uniserve-supervisor.pid

[program:web]
command=apache2-foreground
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
directory=/var/www/html/backend
command=php artisan queue:work --queue=mail-verification,realtime,default --sleep=1 --tries=3 --timeout=60
user=www-data
autorestart=true
startretries=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
directory=/var/www/html/backend
command=php artisan schedule:work
user=www-data
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:reverb]
directory=/var/www/html/backend
command=php artisan reverb:start --host=127.0.0.1 --port=8081
user=www-data
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
