<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSS UniServe &mdash; Super Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="superadmin.css">
</head>

<body>
    <div id="app" class="app-shell">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <span class="crest" id="crestSlotD"></span>
                <span class="name">OSS UniServe<small>System Maintenance</small></span>
            </div>
            <ul class="nav-list" id="navList"></ul>
            <div class="sidebar-foot">
                <button class="user-chip user-chip-btn" id="userChipBtn" onclick="navigate('profile')"
                    title="My Profile">
                    <div class="avatar" id="avatarInit">--</div>
                    <div class="who">
                        <div class="n" id="userNameLbl">--</div>
                        <div class="r" id="userRoleLbl">--</div>
                    </div>
                </button>
                <button class="btn btn-ghost btn-sm btn-block" onclick="doLogout()">Log Out</button>
            </div>
        </aside>

        <div class="main-col">
            <div class="topbar">
                <div style="display:flex; align-items:center; gap:12px;">
                    <button class="menu-btn" id="menuBtn"
                        onclick="document.getElementById('sidebar').classList.toggle('open')">&#9776;</button>
                    <div>
                        <h1 id="pageTitle">Dashboard</h1>
                        <div class="sub" id="pageSub">Overview of today's activity</div>
                    </div>
                </div>
                <div class="topbar-right">
                    <span class="clock" id="clockLbl">--</span>
                    <div class="theme-toggle">
                        <button class="theme-btn" data-theme-btn="light" onclick="setTheme('light')">&#9728;
                            Light</button>
                        <button class="theme-btn" data-theme-btn="dark" onclick="setTheme('dark')">&#9789; Dark</button>
                    </div>
                </div>
            </div>
            <div class="content" id="content"></div>
        </div>
    </div>

    <div class="toast-wrap" id="toastWrap"></div>

    <script src="superadmin.js"></script>
</body>

</html>
